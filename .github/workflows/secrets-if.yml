name: secrets-if
# Probe: does a job whose if: references secrets produce a named check either
# way — success when the secret exists, skipped when it does not — and does a
# name: expression still render on the skipped one? Scoped to
# src/secrets-if.txt to stay out of the other probes' predictions.
on:
  pull_request:
    paths:
      - src/secrets-if.txt
jobs:
  secret-present:
    if: ${{ secrets.GITHUB_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo secret present
  secret-absent:
    if: ${{ secrets.DOES_NOT_EXIST != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
  secret-absent-named:
    name: Absent Named (${{ github.event_name }})
    if: ${{ secrets.DOES_NOT_EXIST != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
