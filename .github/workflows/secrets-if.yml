name: secrets-if
on:
  pull_request:
    paths:
      - src/secrets-if.txt
jobs:
  secret-present:
    if: ${{ secrets.GITHUB_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo secret present
  secret-absent:
    if: ${{ secrets.DOES_NOT_EXIST != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
  secret-absent-named:
    name: Absent Named (${{ github.event_name }})
    if: ${{ secrets.DOES_NOT_EXIST != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
