name: matrix-skip
# Does GitHub expand a STATIC matrix when the job's `if:` evaluates false?
# The fleet's observed case (a skipped fromJSON matrix showing one check with
# literal `${{ }}` text) never separated "matrix unexpandable" from "job
# skipped" — this probe does. Three jobs, same two-value static matrix, named
# with an interpolated parenthetical so the check list says which happened:
# one expanded check per value, or one check carrying the literal expression.
#
# Scoped to `src/matrix-skip.txt` so it stays out of the other probe PRs'
# predictions, the same convention as remote-caller.yml.
on:
  pull_request:
    paths:
      - src/matrix-skip.txt
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.s.outputs.go }}
    steps:
      - id: s
        run: echo "go=no" >> "$GITHUB_OUTPUT"

  static-false:
    if: ${{ false }}
    strategy:
      matrix:
        lang: [go, rust]
    name: static-false (${{ matrix.lang }})
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ matrix.lang }}"

  runtime-false:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'yes' }}
    strategy:
      matrix:
        lang: [go, rust]
    name: runtime-false (${{ matrix.lang }})
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ matrix.lang }}"

  runtime-true:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'no' }}
    strategy:
      matrix:
        lang: [go, rust]
    name: runtime-true (${{ matrix.lang }})
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ matrix.lang }}"
